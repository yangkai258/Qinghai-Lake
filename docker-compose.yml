services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dashboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  admin:
    build: { context: ., dockerfile: Dockerfile.admin }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/dashboard
      ADMIN_JWT_SECRET: change-me-in-prod
      NODE_ENV: production
      NEXT_PUBLIC_DASHBOARD_BASE: http://localhost:3003
      NEXT_PUBLIC_SUPERSET_BASE: http://localhost:8088
    ports:
      - "3004:3004"

  dashboard:
    build: { context: ., dockerfile: Dockerfile.dashboard }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/dashboard
      NODE_ENV: production
    ports:
      - "3003:3003"

  superset:
    image: apache/superset:4.1.0
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SUPERSET_SECRET_KEY: change-me
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@local
      ADMIN_PASSWORD: admin
      SUPERSET_DATABASE_URI: postgresql://superset:superset_readonly_2026@postgres:5432/dashboard
      # Bootstrap the read-only role once:
      # psql -U postgres -d dashboard -f packages/db/setup-superset.sql
    ports:
      - "8088:8088"
    # bootstrap admin user, init db, then run server. See README to skip if you have an existing admin.
    command: >
      sh -c "
        superset db upgrade &&
        superset init &&
        superset run -p 8088 -h 0.0.0.0
      "


  feigua-worker:
    build: { context: ., dockerfile: Dockerfile.feigua-worker }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      FEIGUA_COOKIE: 
      FEIGUA_BASE_URL: 
      FEIGUA_INBOX: /var/inbox/feigua
      INGEST_CRON_FEIGUA: 
      LOG_LEVEL: info
    volumes:
      - feigua-inbox:/var/inbox
    restart: unless-stopped

volumes:
  pgdata:
  feigua-inbox:
  pgdata: